[workspace]
resolver = "2"
members = [
  "crates/ledger",
  "crates/rule-engine",
  "crates/formula-engine",
  "crates/crypto",
  "crates/scheduler",
  "crates/serializer",
  "crates/query-planner",
  "crates/permissions",
  "crates/bindings"
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
napi = { version = "2", features = ["async"] }
napi-derive = "2"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true