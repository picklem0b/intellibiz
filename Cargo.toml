[workspace]
resolver = "2"
members = [
  "crates/ledger",
  "crates/rule-engine",
  "crates/formula-engine",
  "crates/crypto",
  "crates/scheduler",
  "crates/serializer",
  "crates/query-planner",
  "crates/permissions",
  "crates/bindings",
]

[workspace.dependencies]
# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Cryptography
hex         = "0.4"
sha2        = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
aes-gcm     = "0.10"
argon2      = "0.5"

# Fixed-point decimal
rust_decimal = { version = "1.35", features = ["serde"] }

# Concurrency
crossbeam   = "0.8"
parking_lot = "0.12"
tokio       = { version = "1", features = ["full"] }

# Compression
zstd        = "0.13"

# Error handling
thiserror   = "2"

# NAPI-RS
napi        = { version = "2.16", features = ["async"] }
napi-derive = "2.16"

# Chrono for timestamps
chrono      = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true