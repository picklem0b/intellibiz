name: CI
on:
   push:
      branches: [main, dev]
   pull_request:
      branches: [main, dev]
jobs:
   build:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4
         - uses: pnpm/action-setup@v3
         - uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: pnpm
         - run: pnpm install
         - run: pnpm build
         - run: pnpm test
